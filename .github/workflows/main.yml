name: "Crest CI"

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
  pull_request:
  workflow_dispatch:

env:
  # For tests
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8
  LC_ALL: en_US.UTF-8

  # PHP extensions required by Composer and the suite. The Phalcon extension is
  # not here: the unit-tests job installs it for the v5 variant only. The v6
  # variant, and the other jobs, get Phalcon from the phalcon/phalcon composer
  # dev dependency.
  EXTENSIONS: mbstring, zip

  # The cphalcon constraint for the v5 variant. 5.18 is the first release with
  # Phalcon\ADR.
  PHALCON_CONSTRAINT: "^5.18"

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Code style and static analysis
  quality:
    name: "Validate code style and types"

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      # Deliberately the floor, not the newest PHP. phpstan.neon sets no
      # phpVersion, so PHPStan assumes whatever runs it; analyzing on 8.1 is
      # what proves the ^8.1 constraint holds - a newer runtime would accept
      # syntax the floor rejects.
      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: ${{ env.EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Validate composer"
        run: composer validate --no-check-all --no-check-publish

      # No --ignore-platform-reqs: composer.json pins config.platform.php to
      # 8.1.0, so the lock resolves against the floor and installs cleanly on
      # every matrix cell.
      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "PHPCS"
        run: composer cs

      - name: "PHPStan"
        run: composer analyze

      - name: "PHP CS Fixer (dry-run)"
        run: composer cs-fixer

  unit-tests:
    name: "Unit tests (PHP ${{ matrix.php }}, Phalcon ${{ matrix.variant }})"

    permissions:
      contents: read

    runs-on: ubuntu-latest

    needs:
      - quality

    strategy:
      # Every version reports, rather than stopping at the first failure - on a
      # matrix this wide, knowing which versions break is the useful signal.
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        variant:
          # v5 = cphalcon C extension; v6 = phalcon/phalcon composer package
          - 'v5'
          - 'v6'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v5 only, with the same PIE install as resources/docker/Dockerfile.
      # PIE writes to the extension directory, so it needs sudo. sudo resets
      # PATH, so "$(which php)" names the PHP that setup-php installed.
      # phalcon/phalcon stays in vendor/, as in the v5 dev container. The
      # extension classes load first, so the package does not replace them.
      - name: "Install the Phalcon extension"
        if: matrix.variant == 'v5'
        env:
          PIE_VERSION: '1.5.0'
        run: |
          curl -fsSL "https://github.com/php/pie/releases/download/${PIE_VERSION}/pie.phar" -o "${RUNNER_TEMP}/pie.phar"
          sudo "$(which php)" "${RUNNER_TEMP}/pie.phar" install --no-interaction "phalcon/cphalcon:${PHALCON_CONSTRAINT}"
          php -m | grep -i phalcon

      # No --ignore-platform-reqs: composer.json pins config.platform.php to
      # 8.1.0, so the lock resolves against the floor and installs cleanly on
      # every matrix cell.
      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "Unit tests"
        run: composer test

  # Mutation testing is not a job here yet. Infection runs locally for now
  # (`composer infection`, gated at MSI 100 by resources/infection.json5).
  #
  # The blocker is the PHP floor: at ^8.1 composer can only resolve
  # thecodingmachine/safe to dev-master, which eagerly autoloads its function
  # files and floods 8.4+ runs with deprecation notices. Once the floor moves
  # past 8.1 a stable Safe release becomes resolvable and this becomes a
  # standard job alongside the others.
  coverage:
    name: "Coverage, SonarQube and octocov"

    permissions:
      contents: read # to fetch code (actions/checkout)
      pull-requests: write # to comment coverage on PRs (octocov)
      actions: read # to download prior coverage artifacts (octocov)

    runs-on: ubuntu-latest

    needs:
      - unit-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # SonarQube needs the full history to attribute blame.
          fetch-depth: 0
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: ${{ env.EXTENSIONS }}
          coverage: pcov
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      # One clover file feeds both SonarQube and octocov, so the two dashboards
      # can never disagree about the same run.
      - name: "Tests with coverage"
        run: composer test-coverage

      # Push only: a pull request from a fork gets no SONAR_TOKEN. SonarQube
      # runs before octocov, so a failed octocov gate cannot skip the upload.
      - name: "SonarQube Scan"
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=phalcon
            -Dsonar.projectKey=phalcon_crest
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.exclusions=resources/**
            -Dsonar.php.coverage.reportPaths=tests/_output/coverage.xml

      - name: "octocov"
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: ${{ github.event_name == 'pull_request' && 'resources/octocov.pr.yml' || 'resources/octocov.yml' }}
