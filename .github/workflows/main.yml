name: "Crest CI"

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
  pull_request:
  workflow_dispatch:

env:
  # For tests
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8
  LC_ALL: en_US.UTF-8

  # PHP extensions required by Composer and the suite. No Phalcon extension:
  # this workflow runs the v6 variant, where Phalcon arrives as the
  # phalcon/phalcon composer dev dependency. When ext-phalcon 5.18 ships, the
  # v5 variant is added by extending the matrix and installing the extension
  # through setup-php's `extensions` input.
  EXTENSIONS: mbstring, zip

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Code style and static analysis
  quality:
    name: "Validate code style and types"

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      # Deliberately the floor, not the newest PHP. phpstan.neon sets no
      # phpVersion, so PHPStan assumes whatever runs it; analyzing on 8.1 is
      # what proves the ^8.1 constraint holds - a newer runtime would accept
      # syntax the floor rejects.
      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: ${{ env.EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No --ignore-platform-reqs: composer.json pins config.platform.php to
      # 8.1.0, so the lock resolves against the floor and installs cleanly on
      # every matrix cell.
      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "PHPCS"
        run: composer cs

      - name: "PHPStan"
        run: composer analyze

  unit-tests:
    name: "Unit tests"

    permissions:
      contents: read

    runs-on: ubuntu-latest

    needs:
      - quality

    strategy:
      # Every version reports, rather than stopping at the first failure - on a
      # matrix this wide, knowing which versions break is the useful signal.
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No --ignore-platform-reqs: composer.json pins config.platform.php to
      # 8.1.0, so the lock resolves against the floor and installs cleanly on
      # every matrix cell.
      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "Unit tests"
        run: composer test

  # Mutation testing is not a job here yet. Infection runs locally for now
  # (`composer infection`, gated at MSI 100 by resources/infection.json5).
  #
  # The blocker is the PHP floor: at ^8.1 composer can only resolve
  # thecodingmachine/safe to dev-master, which eagerly autoloads its function
  # files and floods 8.4+ runs with deprecation notices. Once the floor moves
  # past 8.1 a stable Safe release becomes resolvable and this becomes a
  # standard job alongside the others.
  coverage:
    name: "Coverage, SonarQube and octocov"

    permissions:
      contents: read # to fetch code (actions/checkout)
      pull-requests: write # to comment coverage on PRs (octocov)
      actions: read # to download prior coverage artifacts (octocov)

    runs-on: ubuntu-latest

    needs:
      - unit-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # SonarQube needs the full history to attribute blame.
          fetch-depth: 0
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: ${{ env.EXTENSIONS }}
          coverage: pcov
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      # One clover file feeds both SonarQube and octocov, so the two dashboards
      # can never disagree about the same run.
      - name: "Tests with coverage"
        run: composer test-coverage

      - name: "SonarQube Scan"
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=phalcon
            -Dsonar.projectKey=phalcon_crest
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.exclusions=resources/**
            -Dsonar.php.coverage.reportPaths=tests/_output/coverage.xml

      - name: "octocov"
        uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1
        with:
          config: ${{ github.event_name == 'pull_request' && 'resources/octocov.pr.yml' || 'resources/octocov.yml' }}
