name: "Crest CI"

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
  pull_request:
  workflow_dispatch:

env:
  # For tests
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8
  LC_ALL: en_US.UTF-8

  # PHP extensions required by Composer and the suite. The Phalcon extension is
  # not here: the unit-tests job installs it for the v5 variant only. The v6
  # variant, and the other jobs, get Phalcon from the phalcon/phalcon composer
  # dev dependency.
  EXTENSIONS: mbstring, zip

  # The PDO drivers of the database jobs.
  DB_EXTENSIONS: pdo_mysql, pdo_pgsql, pdo_sqlite

  # The cphalcon constraint for the v5 variant. 5.18 is the first release with
  # Phalcon\ADR.
  PHALCON_CONSTRAINT: "^5.18"

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Code style and static analysis
  quality:
    name: "Validate code style and types"

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      # Deliberately the floor, not the newest PHP. phpstan.neon sets no
      # phpVersion, so PHPStan assumes whatever runs it; analyzing on 8.1 is
      # what proves the ^8.1 constraint holds - a newer runtime would accept
      # syntax the floor rejects.
      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          extensions: ${{ env.EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Validate composer"
        run: composer validate --no-check-all --no-check-publish

      # No --ignore-platform-reqs: composer.json pins config.platform.php to
      # 8.1.0, so the lock resolves against the floor and installs cleanly on
      # every matrix cell.
      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "PHPCS"
        run: composer cs

      - name: "PHPStan"
        run: composer analyze

      - name: "PHP CS Fixer (dry-run)"
        run: composer cs-fixer

  unit-tests:
    name: "Unit tests (PHP ${{ matrix.php }}, Phalcon ${{ matrix.variant }})"

    permissions:
      contents: read

    runs-on: ubuntu-latest

    needs:
      - quality

    strategy:
      # Every version reports, rather than stopping at the first failure - on a
      # matrix this wide, knowing which versions break is the useful signal.
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        variant:
          # v5 = cphalcon C extension; v6 = phalcon/phalcon composer package
          - 'v5'
          - 'v6'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v5 only, with the PIE install of resources/docker/Dockerfile.
      # PIE writes to the extension directory, so it needs sudo. sudo resets
      # PATH, so "$(which php)" names the PHP that setup-php installed.
      # phalcon/phalcon stays in vendor/, as in the v5 dev container. The
      # extension classes load first, so the package does not replace them.
      #
      # PIE enables the extension itself, but on the runner that gives a second
      # "extension=phalcon", and PHP then prints "Module phalcon is already
      # loaded" on every start. The tests that read the stderr of a child PHP
      # process then fail. Thus --skip-enable-extension, and one INI entry here
      # (as in phalcon/debugbar).
      - name: "Install the Phalcon extension"
        if: matrix.variant == 'v5'
        env:
          PIE_VERSION: '1.5.0'
          PHP_VERSION: ${{ matrix.php }}
        run: |
          curl -fsSL "https://github.com/php/pie/releases/download/${PIE_VERSION}/pie.phar" -o "${RUNNER_TEMP}/pie.phar"
          sudo "$(which php)" "${RUNNER_TEMP}/pie.phar" install --skip-enable-extension --no-interaction "phalcon/cphalcon:${PHALCON_CONSTRAINT}"
          echo "extension=phalcon.so" | sudo tee "/etc/php/${PHP_VERSION}/cli/conf.d/80-phalcon.ini"
          php -m | grep -i phalcon

      # No --ignore-platform-reqs: composer.json pins config.platform.php to
      # 8.1.0, so the lock resolves against the floor and installs cleanly on
      # every matrix cell.
      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "Unit tests"
        run: composer test

  # Windows (#103): the code for Windows runs here, not only in the unit tests
  # that fake it. The unit suite, a real hand-off and a real PATHEXT lookup, on
  # the v6 variant (phalcon/phalcon, no extension). The runner cannot run Linux
  # containers, so `new`, `up` and `down` with docker do not run here.
  windows:
    name: "Windows (PHP 8.4, Phalcon v6)"

    permissions:
      contents: read

    runs-on: windows-latest

    needs:
      - quality

    steps:
      # git on the runner turns LF into CRLF. The stubs and the expected
      # outputs of the suite have LF.
      - name: "Keep the line endings"
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: ${{ env.EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "Unit tests"
        run: composer test

      # The crest of the checkout is the global crest. In a project with its
      # own crest, it runs php.exe vendor\bin\crest and gives back the exit
      # status. The project has no Phalcon, so only the crest of the project
      # shows "not installed" for Phalcon in `about`.
      - name: "Hand-off"
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'handoff'
          $crest = $env:GITHUB_WORKSPACE -replace '\\', '/'
          New-Item -ItemType Directory -Path $project | Out-Null
          $composer = [ordered]@{
              'name' = 'phalcon/crest-handoff'
              'repositories' = @(@{ 'type' = 'path'; 'url' = $crest })
              'require-dev' = @{ 'phalcon/crest' = '*' }
              'minimum-stability' = 'dev'
          }
          $composer | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $project 'composer.json')
          "<?php return ['flavor' => 'mvc'];" | Set-Content -Path (Join-Path $project 'crest.php')
          composer install --working-dir=$project --no-interaction --no-progress
          if ($LASTEXITCODE -ne 0) { throw "composer install gave $LASTEXITCODE" }
          Set-Location $project
          $about = php (Join-Path $env:GITHUB_WORKSPACE 'bin/crest') about | Out-String
          if ($LASTEXITCODE -ne 0) { throw "about gave $LASTEXITCODE" }
          Write-Output $about
          if ($about -notmatch 'Phalcon\s+not installed') { throw 'the crest of the project did not run' }
          php (Join-Path $env:GITHUB_WORKSPACE 'bin/crest') no-such-command
          if ($LASTEXITCODE -ne 1) { throw "an unknown command gave $LASTEXITCODE, not 1" }
          exit 0

      # ShellRunner finds a program through PATHEXT, as `docker` finds
      # docker.exe. git.exe is on the PATH of each runner, and docker.exe when
      # the runner image has it.
      - name: "Command lookup"
        shell: pwsh
        run: |
          $programs = @('git')
          if (Get-Command docker -ErrorAction SilentlyContinue) { $programs += 'docker' }
          foreach ($program in $programs) {
              php -r "require 'vendor/autoload.php'; exit((new Crest\Process\ShellRunner())->run(['$program', '--version']));"
              if ($LASTEXITCODE -ne 0) { throw "ShellRunner gave $LASTEXITCODE for $program" }
          }

  # The database tests: one job for each driver, as in phalcon. Each job runs
  # tests/Database on its driver (talon.php). PHP 8.1 only: the unit-tests job
  # covers the PHP versions. The tests remove each table of the database.
  db-sqlite-tests:
    name: "SQLite tests (PHP 8.1, Phalcon ${{ matrix.variant }})"

    permissions:
      contents: read

    runs-on: ubuntu-latest

    needs:
      - quality

    strategy:
      fail-fast: false
      matrix:
        variant:
          - 'v5'
          - 'v6'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          extensions: ${{ env.EXTENSIONS }}, ${{ env.DB_EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v5 only: the PIE install of the unit-tests job. See the note there.
      - name: "Install the Phalcon extension"
        if: matrix.variant == 'v5'
        env:
          PIE_VERSION: '1.5.0'
          PHP_VERSION: '8.1'
        run: |
          curl -fsSL "https://github.com/php/pie/releases/download/${PIE_VERSION}/pie.phar" -o "${RUNNER_TEMP}/pie.phar"
          sudo "$(which php)" "${RUNNER_TEMP}/pie.phar" install --skip-enable-extension --no-interaction "phalcon/cphalcon:${PHALCON_CONSTRAINT}"
          echo "extension=phalcon.so" | sudo tee "/etc/php/${PHP_VERSION}/cli/conf.d/80-phalcon.ini"
          php -m | grep -i phalcon

      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "SQLite tests"
        run: composer test-db-sqlite

  db-mysql-tests:
    name: "MySQL tests (PHP 8.1, Phalcon ${{ matrix.variant }})"

    permissions:
      contents: read

    runs-on: ubuntu-latest

    needs:
      - quality

    strategy:
      fail-fast: false
      matrix:
        variant:
          - 'v5'
          - 'v6'

    services:
      mysql:
        image: mysql:8.4
        ports:
          - "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: crest
          MYSQL_DATABASE: crest
          MYSQL_PASSWORD: secret
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          extensions: ${{ env.EXTENSIONS }}, ${{ env.DB_EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v5 only: the PIE install of the unit-tests job. See the note there.
      - name: "Install the Phalcon extension"
        if: matrix.variant == 'v5'
        env:
          PIE_VERSION: '1.5.0'
          PHP_VERSION: '8.1'
        run: |
          curl -fsSL "https://github.com/php/pie/releases/download/${PIE_VERSION}/pie.phar" -o "${RUNNER_TEMP}/pie.phar"
          sudo "$(which php)" "${RUNNER_TEMP}/pie.phar" install --skip-enable-extension --no-interaction "phalcon/cphalcon:${PHALCON_CONSTRAINT}"
          echo "extension=phalcon.so" | sudo tee "/etc/php/${PHP_VERSION}/cli/conf.d/80-phalcon.ini"
          php -m | grep -i phalcon

      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "MySQL tests"
        env:
          DATA_MYSQL_HOST: 127.0.0.1
          DATA_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          DATA_MYSQL_USER: root
          DATA_MYSQL_PASS: secret
          DATA_MYSQL_NAME: crest
        run: composer test-db-mysql

  db-mariadb-tests:
    name: "MariaDB tests (PHP 8.1, Phalcon ${{ matrix.variant }})"

    permissions:
      contents: read

    runs-on: ubuntu-latest

    needs:
      - quality

    strategy:
      fail-fast: false
      matrix:
        variant:
          - 'v5'
          - 'v6'

    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: crest
          MYSQL_DATABASE: crest
          MYSQL_PASSWORD: secret
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          extensions: ${{ env.EXTENSIONS }}, ${{ env.DB_EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v5 only: the PIE install of the unit-tests job. See the note there.
      - name: "Install the Phalcon extension"
        if: matrix.variant == 'v5'
        env:
          PIE_VERSION: '1.5.0'
          PHP_VERSION: '8.1'
        run: |
          curl -fsSL "https://github.com/php/pie/releases/download/${PIE_VERSION}/pie.phar" -o "${RUNNER_TEMP}/pie.phar"
          sudo "$(which php)" "${RUNNER_TEMP}/pie.phar" install --skip-enable-extension --no-interaction "phalcon/cphalcon:${PHALCON_CONSTRAINT}"
          echo "extension=phalcon.so" | sudo tee "/etc/php/${PHP_VERSION}/cli/conf.d/80-phalcon.ini"
          php -m | grep -i phalcon

      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "MariaDB tests"
        env:
          DATA_MARIADB_HOST: 127.0.0.1
          DATA_MARIADB_PORT: ${{ job.services.mariadb.ports['3306'] }}
          DATA_MARIADB_USER: root
          DATA_MARIADB_PASS: secret
          DATA_MARIADB_NAME: crest
        run: composer test-db-mariadb

  db-pgsql-tests:
    name: "PostgreSQL tests (PHP 8.1, Phalcon ${{ matrix.variant }})"

    permissions:
      contents: read

    runs-on: ubuntu-latest

    needs:
      - quality

    strategy:
      fail-fast: false
      matrix:
        variant:
          - 'v5'
          - 'v6'

    services:
      postgres:
        image: postgres:18-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: crest
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: crest
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          extensions: ${{ env.EXTENSIONS }}, ${{ env.DB_EXTENSIONS }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v5 only: the PIE install of the unit-tests job. See the note there.
      - name: "Install the Phalcon extension"
        if: matrix.variant == 'v5'
        env:
          PIE_VERSION: '1.5.0'
          PHP_VERSION: '8.1'
        run: |
          curl -fsSL "https://github.com/php/pie/releases/download/${PIE_VERSION}/pie.phar" -o "${RUNNER_TEMP}/pie.phar"
          sudo "$(which php)" "${RUNNER_TEMP}/pie.phar" install --skip-enable-extension --no-interaction "phalcon/cphalcon:${PHALCON_CONSTRAINT}"
          echo "extension=phalcon.so" | sudo tee "/etc/php/${PHP_VERSION}/cli/conf.d/80-phalcon.ini"
          php -m | grep -i phalcon

      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      - name: "PostgreSQL tests"
        env:
          DATA_POSTGRES_HOST: 127.0.0.1
          DATA_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          DATA_POSTGRES_USER: crest
          DATA_POSTGRES_PASS: secret
          DATA_POSTGRES_NAME: crest
          DATA_POSTGRES_SCHEMA: public
        run: composer test-db-pgsql

  # Mutation testing is not a job here yet. Infection runs locally only, and is
  # not a dependency: `composer require --dev infection/infection`, then
  # `composer infection` (gated at MSI 100 by resources/infection.json5), then
  # `composer remove --dev infection/infection`.
  #
  # The blocker is the PHP floor: at ^8.1 composer can only resolve
  # thecodingmachine/safe to dev-master, which eagerly autoloads its function
  # files and floods 8.4+ runs with deprecation notices. Once the floor moves
  # past 8.1 a stable Safe release becomes resolvable and this becomes a
  # standard job alongside the others.
  coverage:
    name: "Coverage, SonarQube and octocov"

    permissions:
      contents: read # to fetch code (actions/checkout)
      pull-requests: write # to comment coverage on PRs (octocov)
      actions: read # to download prior coverage artifacts (octocov)

    runs-on: ubuntu-latest

    needs:
      - unit-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # SonarQube needs the full history to attribute blame.
          fetch-depth: 0
          token: ${{ github.token }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          extensions: ${{ env.EXTENSIONS }}
          coverage: pcov
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install dependencies with Composer"
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          composer-options: "--prefer-dist"

      # One clover file feeds both SonarQube and octocov, so the two dashboards
      # can never disagree about the same run. test-coverage runs the full
      # configuration: the unit tests and the SQLite tests in one run.
      - name: "Tests with coverage"
        run: composer test-coverage

      # Push only: a pull request from a fork gets no SONAR_TOKEN. SonarQube
      # runs before octocov, so a failed octocov gate cannot skip the upload.
      - name: "SonarQube Scan"
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=phalcon
            -Dsonar.projectKey=phalcon_crest
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.exclusions=resources/**
            -Dsonar.php.coverage.reportPaths=tests/_output/coverage.xml

      - name: "octocov"
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: ${{ github.event_name == 'pull_request' && 'resources/octocov.pr.yml' || 'resources/octocov.yml' }}
